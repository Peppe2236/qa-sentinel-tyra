name: QA CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: qa-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Analyzer unit tests
        run: npm run test:unit

  qa-sites:
    name: Live Chromium both sites
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: qa:sites (Nation + Skills Chromium)
        id: sites
        continue-on-error: true
        run: npm run qa:sites
        env:
          CI: true
          QA_MAX_PAGES: '20'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            reports/human-review.html
            reports/executive-report.pdf
            dashboard/data/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Live E2E note
        if: always()
        run: |
          echo "qa:sites is Chromium-only for both sites. It is not the required gate."
          echo "Typecheck and unit tests are required. Live E2E may flake against nation.dev."
          echo "The full 18-project matrix is local: npm run qa:unattended"
          echo "sites step outcome: ${{ steps.sites.outcome }}"
